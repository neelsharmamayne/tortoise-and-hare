# Run from the gratitude/ folder:  docker compose -f server/docker-compose.yml up -d
services:
  journal:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATA_DIR=/app/server/data
    volumes:
      - ./data:/app/server/data
    restart: unless-stopped
